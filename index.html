<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floor Plan — Bedroom + stair landing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --table:#16323F; --panel:#0F2530; --line:#27414D; --paper:#F7F8F5;
    --grid:#DCE4E7; --gridfoot:#BACAD1; --ink:#17222A; --dim:#415A66;
    --accent:#F2B705; --accentink:#16323F; --closet:#E7EDEA; --soft:#8FA6AF;
    --field:#0A1B24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--table);font-family:'Archivo Narrow',system-ui,sans-serif;
       display:flex;flex-direction:row;overflow:hidden}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0}
  #bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;
       border-bottom:1px solid var(--line)}
  .eyebrow{font-weight:700;font-size:11px;letter-spacing:2px;color:var(--accent)}
  .docname{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--soft)}
  .spacer{flex:1}
  button{font-family:'Archivo Narrow',sans-serif;font-weight:600;font-size:10px;
         letter-spacing:1px;padding:6px 10px;border-radius:2px;cursor:pointer;
         background:transparent;color:var(--paper);border:1px solid var(--line);
         white-space:nowrap}
  button:hover{border-color:var(--soft)}
  button.on{background:var(--accent);color:var(--accentink);border-color:var(--accent)}
  button.danger{color:#F08A7A}
  #wrap{flex:1;padding:8px;min-height:0}
  svg#plan{width:100%;height:100%;background:var(--paper);display:block;touch-action:none}
  #panel{width:320px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);
         display:flex;flex-direction:column;overflow-y:auto}
  .sec{padding:12px;border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:none}
  h2{font-weight:700;font-size:9px;letter-spacing:2px;color:var(--soft);margin-bottom:10px}
  .row{display:flex;gap:8px;margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chips .lbl{font-size:9px;font-weight:600;letter-spacing:1px;color:var(--soft)}
  .brk{flex-basis:100%;height:0}
  label.f{flex:1;min-width:0;display:block}
  label.f span{display:block;margin-bottom:4px;font-size:9px;font-weight:600;
               letter-spacing:1px;color:var(--soft)}
  input,select{width:100%;padding:6px 8px;background:var(--field);color:var(--paper);
        border:1px solid var(--line);border-radius:2px;outline:none;
        font-family:'IBM Plex Mono',monospace;font-size:13px}
  input:focus,select:focus{border-color:var(--accent)}
  input[type=range]{padding:0;height:26px;background:transparent;border:none;accent-color:var(--accent)}
  #hint{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--soft);line-height:1.6}
  #note,#roomNote{width:100%;padding-top:6px;font-family:'IBM Plex Mono',monospace;
        font-size:10px;color:var(--accent)}
  @media (max-width:820px){
    body{flex-direction:column;overflow:auto}
    #stage{min-height:58vh}
    #panel{width:100%;border-left:none;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>

<div id="stage">
  <div id="bar">
    <span class="eyebrow">FLOOR PLAN</span>
    <span class="docname" id="docname"></span>
    <span class="spacer"></span>
    <button id="bFeet">FT-IN</button>
    <button id="bDims">ALL DIMS</button>
    <button id="b3d">3D</button>
    <button id="bUndo">UNDO</button>
    <button id="bRedo">REDO</button>
  </div>
  <div id="wrap"><svg id="plan" preserveAspectRatio="xMidYMid meet"></svg></div>
</div>

<div id="panel">
  <div class="sec">
    <h2>ROOMS</h2>
    <div class="row">
      <label class="f"><span>OPEN &mdash; <span id="roomCount" style="display:inline"></span></span>
        <select id="roomSel"></select></label>
    </div>
    <div class="row">
      <label class="f"><span>ROOM NAME</span><input type="text" id="roomName" placeholder="Untitled room"></label>
    </div>
    <div class="chips">
      <button id="bNewRoom">NEW</button>
      <button id="bDupRoom">DUPLICATE</button>
      <button id="bDelRoom" class="danger">DELETE</button>
    </div>
    <div class="chips" style="margin-top:8px">
      <span class="lbl">SHARE</span>
      <button id="bShare">COPY LINK</button>
      <button id="bExpRoom">EXPORT ROOM</button>
      <button id="bExpAll">EXPORT ALL</button>
      <button id="bImport">IMPORT</button>
      <input type="file" id="roomFile" accept="application/json,.json" hidden>
    </div>
    <div id="roomNote"></div>
  </div>

  <div class="sec">
    <h2>ROOM</h2>
    <div class="row">
      <label class="f"><span>WIDTH</span><input type="number" id="rw" step="0.25"></label>
      <label class="f"><span>DEPTH</span><input type="number" id="rh" step="0.25"></label>
    </div>
    <div class="row">
      <label class="f"><span>TOP WALL &rarr; CLOSET WALL</span><input type="number" id="rs" step="0.25"></label>
    </div>
    <div class="chips">
      <span class="lbl">SNAP</span>
      <button class="snap" data-s="0">OFF</button>
      <button class="snap" data-s="1">1"</button>
      <button class="snap" data-s="3">3"</button>
      <button class="snap" data-s="6">6"</button>
      <button class="snap" data-s="12">12"</button>
    </div>
  </div>

  <div class="sec">
    <h2>TITLE BLOCK</h2>
    <div class="row">
      <label class="f"><span>PLAN NAME &mdash; BLANK TO HIDE</span><input type="text" id="tName" placeholder="(none)"></label>
    </div>
    <div class="row">
      <label class="f"><span>TEXT SIZE</span><input type="number" id="tSize" step="0.5" min="3" max="24"></label>
      <label class="f"><span>&nbsp;</span><button id="tShow" style="width:100%;padding:7px 10px">SHOW BLOCK</button></label>
    </div>
  </div>

  <div class="sec" id="sec3d" style="display:none">
    <h2>3D VIEW</h2>
    <div class="row">
      <label class="f"><span>ROTATE</span><input type="range" id="v3yaw" min="0" max="360" step="5"></label>
      <label class="f"><span>TILT</span><input type="range" id="v3pitch" min="8" max="85" step="1"></label>
    </div>
    <div class="row">
      <label class="f"><span>CEILING HEIGHT</span><input type="number" id="v3ceil" step="1" min="60" max="180"></label>
      <label class="f"><span>&nbsp;</span><button id="v3reset" style="width:100%;padding:7px 10px">RESET VIEW</button></label>
    </div>
  </div>

  <div class="sec">
    <h2>TEXT SIZE</h2>
    <div class="row">
      <label class="f"><span>ITEM LABELS</span><input type="number" id="lSize" step="0.5" min="2" max="30"></label>
      <label class="f"><span>DIMENSIONS</span><input type="number" id="dSize" step="0.5" min="2" max="30"></label>
    </div>
  </div>

  <div class="sec">
    <h2>ADD</h2>
    <div class="chips" id="addRow"></div>
  </div>

  <div class="sec" style="flex:1">
    <h2 id="selHead">SELECTION</h2>
    <div id="props"></div>
  </div>

  <div class="sec">
    <div class="chips">
      <button id="bSvg">EXPORT DRAWING</button>
      <button id="bJson">COPY DATA</button>
      <button id="bReset">RESET</button>
      <div id="note"></div>
    </div>
  </div>
</div>

<script>
/* ─────────── constants ─────────── */
const WALL = 5;

/* IKEA PAX frame sizes, inches. Singles plus the stock 2-frame kits. */
const PAX_W = [["19⅝",19.625],["29½",29.5],["39¼",39.25],["58⅞",58.875],["78⅝",78.625]];
const PAX_D = [["13¾ DEEP",13.75],["22⅞ DEEP",22.875]];
const BEDS  = {Twin:[38,75],"Twin XL":[38,80],Full:[54,75],Queen:[60,80],King:[76,80]};

/* Nightstands — IKEA current sizes, width × depth in inches */
const NIGHT = [["HEMNES",18.125,13.75],["MALM",15.75,18.875],
               ["SONGESAND",16.5,15.75],["NORDKISA",23.625,15.75]];

/* Bookcases / shelf units */
const SHELF = [["BILLY 15¾",15.75,11],["BILLY 31½",31.5,11],
               ["KALLAX 1×4",16.125,15.375],["KALLAX 2×2 / 2×4",30.375,15.375],
               ["KALLAX 4×4",57.875,15.375]];

const TYPES = {closet:"Wardrobe", bed:"Bed", nightstand:"Nightstand", shelf:"Bookcase",
               opening:"Opening", door:"Door", window:"Window", stairs:"Stairs",
               wall:"Wall", fixture:"Fixture"};

const SKETCH = {
  name:"Bedroom + stair landing",
  room:{w:128, h:200},
  splitY:120,
  showTitle:false,
  titleSize:3,
  labelSize:8,
  dimSize:8,
  items:[
    {id:"win",     type:"window",     label:"Window",     x:45,  y:-4,  w:34,    h:8,      rot:0},
    {id:"bed",     type:"bed",        label:"Full",       x:61,  y:-6,  w:54,    h:75,     rot:90},
    {id:"n1",      type:"nightstand", label:"Nightstand", x:109, y:62,  w:18.125,h:13.75,  rot:90,  ls:3},
    {id:"c1",      type:"closet",     label:"PAX 39\u00BC", x:32,  y:97,  w:39.25, h:22.875, rot:0, doors:"hinged", ls:5.5},
    {id:"2e67r78", type:"closet",     label:"PAX",        x:72,  y:97,  w:13.75, h:13.75,  rot:0,  doors:"hinged", ls:4},
    {id:"zp2sqe2", type:"closet",     label:"PAX 39\u00BC", x:86,  y:97,  w:39.25, h:22.875, rot:0, doors:"hinged", ls:5.5},
    {id:"bzpz5rn", type:"door",       label:"Door",       x:2,   y:119, w:30,    h:30,     rot:0,  flip:false},
    {id:"h9ezwve", type:"opening",    label:"Open Area",  x:2,   y:120, w:124,   h:79,     rot:0,  ls:6},
    {id:"s1",      type:"stairs",     label:"UP",         x:96,  y:152, w:31,    h:46,     rot:0}
  ]
};

/* ─────────── state ─────────── */
let doc = clone(SKETCH), sel = null, feet = true, snap = 1, showDims = false;
let past = [], future = [], panelFor = "\u0000", drag = null;

const svg  = document.getElementById("plan");
const $    = id => document.getElementById(id);

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }

function fmt(n){
  const v = Math.round(n*4)/4;
  if(!feet) return v+'"';
  const s = v<0?"-":"", a = Math.abs(v);
  const f = Math.floor(a/12), i = Math.round((a-f*12)*4)/4;
  if(f===0) return s+i+'"';
  return i===0 ? s+f+"'" : s+f+"'-"+i+'"';
}
function rotVec(x,y,deg){
  const a=deg*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
  return {x:x*c-y*s, y:x*s+y*c};
}
const sn = v => snap ? Math.round(v/snap)*snap : Math.round(v*4)/4;

/* ─────────── history ─────────── */
function push(){ past.push(clone(doc)); if(past.length>60) past.shift(); future=[]; }
function undo(){ if(!past.length) return; future.push(clone(doc)); doc = past.pop(); render(); }
function redo(){ if(!future.length) return; past.push(clone(doc)); doc = future.pop(); render(); }

/* ═══════════ room library ═══════════
   Every room lives in one localStorage record: {v, activeId, rooms:[{id,name,updated,doc}]}.
   The same record backs the 2D and the 3D page, so a room saved in one opens in the other.
   Rooms travel between browsers as a .json file or as a self-contained #room= link. */
const LIB_KEY     = "floorplan-rooms-v1";
const LEGACY_KEYS = ["floorplan-v10","floorplan-v8"];   /* single-plan keys from earlier builds */
const SHARE_TAG   = "#room=";
const MAX_ROOMS   = 60;
const MAX_ITEMS   = 400;
const DOORMODES   = ["hinged","sliding","open"];

let lib = {v:1, activeId:null, rooms:[]};
let armDel = false;

function store(){ try{ return window.localStorage; }catch(e){ return null; } }
function libSave(){
  const s = store(); if(!s) return;
  try{ s.setItem(LIB_KEY, JSON.stringify(lib)); }
  catch(e){ note("Browser storage is full or blocked — export the room to keep it"); }
}

/* ─────────── sanitising — imported rooms come from other people ─────────── */
function numv(v,dflt,lo,hi){
  const n = typeof v==="number" ? v : parseFloat(v);
  if(!isFinite(n)) return dflt;
  return Math.max(lo, Math.min(hi, n));
}
function txt(v,max){ return String(v==null?"":v).replace(/[\u0000-\u001f\u007f]/g,"").slice(0,max); }

function cleanDoc(d){
  if(!d || typeof d!=="object" || Array.isArray(d)) return null;
  if(!d.room && !Array.isArray(d.items)) return null;
  const r = d.room || {};
  const out = {
    name: txt(d.name,80),
    room: {w:numv(r.w,128,1,4000), h:numv(r.h,200,1,4000)},
    showTitle: d.showTitle !== false,
    titleSize: numv(d.titleSize,3,3,24),
    labelSize: numv(d.labelSize,8,2,30),
    dimSize:   numv(d.dimSize,8,2,30),
    items: []
  };
  out.splitY = numv(d.splitY, out.room.h, -4000, 4000);
  const seen = new Set();
  (Array.isArray(d.items)?d.items:[]).slice(0,MAX_ITEMS).forEach(s=>{
    if(!s || typeof s!=="object") return;
    const o = {
      id:    txt(s.id,24) || uid(),
      type:  TYPES[s.type] ? s.type : "fixture",
      label: txt(s.label,60),
      x: numv(s.x,0,-4000,4000), y: numv(s.y,0,-4000,4000),
      w: numv(s.w,12,0.25,4000), h: numv(s.h,12,0.25,4000),
      rot: (numv(s.rot,0,-36000,36000)%360+360)%360
    };
    if(s.ls    != null) o.ls    = numv(s.ls,8,2,30);
    if(s.h3    != null) o.h3    = numv(s.h3,30,0,600);     /* 3D object height */
    if(s.sill  != null) o.sill  = numv(s.sill,30,0,600);   /* 3D window sill   */
    if(s.doors != null) o.doors = DOORMODES.indexOf(s.doors)<0 ? "hinged" : s.doors;
    if(s.flip  != null) o.flip  = !!s.flip;
    while(seen.has(o.id)) o.id = uid();
    seen.add(o.id);
    out.items.push(o);
  });
  return out;
}

/* ─────────── records ─────────── */
function uniqueName(n){
  const base = txt(n,60) || "Untitled room";
  if(!lib.rooms.some(r=>r.name===base)) return base;
  for(let i=2;;i++){ const t = base+" ("+i+")"; if(!lib.rooms.some(r=>r.name===t)) return t; }
}
function roomRec(name,d){ return {id:uid()+uid(), name:uniqueName(name), updated:Date.now(), doc:d}; }
function cleanRoom(r){
  if(!r || typeof r!=="object") return null;
  const d = cleanDoc(r.doc || r);
  if(!d) return null;
  return {id:txt(r.id,32)||uid()+uid(), name:txt(r.name,60)||d.name||"Untitled room",
          updated:numv(r.updated,0,0,8.64e15), doc:d};
}
function activeRoom(){ return lib.rooms.find(r=>r.id===lib.activeId) || null; }

/* ─────────── persistence (silently skipped if blocked) ─────────── */
function save(){
  const r = activeRoom(); if(!r) return;
  r.doc = doc; r.updated = Date.now();
  libSave();
}

function load(){
  const s = store();
  let raw = null;
  try{ raw = s && s.getItem(LIB_KEY); }catch(e){}
  if(raw){
    try{
      const p = JSON.parse(raw);
      if(p && Array.isArray(p.rooms)){
        lib.rooms    = p.rooms.slice(0,MAX_ROOMS).map(cleanRoom).filter(Boolean);
        lib.activeId = txt(p.activeId,64) || null;
      }
    }catch(e){}
  }
  if(!lib.rooms.length) migrateLegacy();
  if(!lib.rooms.length) lib.rooms.push(roomRec(SKETCH.name, clone(SKETCH)));
  if(!activeRoom()) lib.activeId = lib.rooms[0].id;
  doc = clone(activeRoom().doc);
  libSave();
}

/* Earlier builds kept one plan per page. Fold whatever is there into the library once. */
function migrateLegacy(){
  const s = store(); if(!s) return;
  const seen = new Set();
  LEGACY_KEYS.forEach(k=>{
    let d = null;
    try{ d = JSON.parse(s.getItem(k) || "null"); }catch(e){}
    d = cleanDoc(d); if(!d) return;
    const sig = JSON.stringify(d);
    if(seen.has(sig)) return;                      /* both pages held the same plan */
    seen.add(sig);
    lib.rooms.push(roomRec(d.name || "Saved plan", d));
  });
}

/* ─────────── switch / add / delete ─────────── */
function switchRoom(id){
  const r = lib.rooms.find(x=>x.id===id);
  if(!r || r.id===lib.activeId) return;
  save();                                          /* the room we are leaving keeps its edits */
  lib.activeId = r.id; doc = clone(r.doc); sel = null; past = []; future = [];
  libSave(); render();
}
function openRoom(rec){
  if(lib.rooms.length >= MAX_ROOMS){ note("Library is full at " + MAX_ROOMS + " rooms — delete one first"); return; }
  lib.rooms.push(rec); lib.activeId = rec.id;
  doc = clone(rec.doc); sel = null; past = []; future = [];
  libSave(); render();
}
function delRoom(id){
  const i = lib.rooms.findIndex(r=>r.id===id);
  if(i<0) return;
  const gone = lib.rooms[i].name;
  lib.rooms.splice(i,1);
  if(!lib.rooms.length) lib.rooms.push(roomRec(SKETCH.name, clone(SKETCH)));
  const next = lib.rooms[Math.min(i, lib.rooms.length-1)];
  lib.activeId = next.id; doc = clone(next.doc); sel = null; past = []; future = [];
  libSave(); render(); note('Deleted "' + gone + '"');
}

function renderRooms(){
  const s = $("roomSel"); if(!s) return;
  s.innerHTML = lib.rooms.map(r=>
    `<option value="${esc(r.id)}"${r.id===lib.activeId?" selected":""}>${esc(r.name)}</option>`).join("");
  $("roomCount").textContent = lib.rooms.length + " SAVED";
  const n = $("roomName"), a = activeRoom();
  if(a && document.activeElement !== n) n.value = a.name;
  if(armDel){ armDel = false; $("bDelRoom").textContent = "DELETE"; }   /* any other move disarms it */
}

/* ─────────── sharing: files and links ─────────── */
function bundle(rooms){
  return {kind:"floorplan-rooms", v:1, exported:new Date().toISOString(),
          rooms:rooms.map(r=>({name:r.name, doc:r.doc}))};
}
function fileSafe(s){
  return txt(s,40).replace(/[^A-Za-z0-9._-]+/g,"-").replace(/^-+|-+$/g,"") || "room";
}
function download(name, text){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"application/json"}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* Accepts a bundle, a bare list, or a single plan — what COPY DATA puts on the clipboard. */
function ingest(data){
  const out = [];
  const take = (name,d)=>{
    const c = cleanDoc(d);
    if(c && out.length<MAX_ROOMS) out.push({name:txt(name,60)||c.name, doc:c});
  };
  if(!data || typeof data!=="object") return out;
  const list = Array.isArray(data) ? data : (Array.isArray(data.rooms) ? data.rooms : null);
  if(list) list.slice(0,MAX_ROOMS).forEach(r=>{ if(r && typeof r==="object") take(r.name, r.doc || r); });
  else take(data.name, data);
  return out;
}

/* Imports never overwrite: each arrival becomes a new room with a fresh id and a free name. */
function adopt(list){
  if(!list.length){ note("No rooms in that data"); return; }
  save();
  const use = list.slice(0, Math.max(0, MAX_ROOMS - lib.rooms.length));
  if(!use.length){ note("Library is full at " + MAX_ROOMS + " rooms — delete one first"); return; }
  let first = null;
  use.forEach(r=>{ const rec = roomRec(r.name, r.doc); lib.rooms.push(rec); first = first || rec; });
  lib.activeId = first.id; doc = clone(first.doc); sel = null; past = []; future = [];
  libSave(); render();
  note("Imported " + use.length + (use.length===1?" room":" rooms") +
       (use.length < list.length ? " — " + (list.length-use.length) + " skipped, library full" : ""));
}

function readRoomFile(f){
  if(f.size > 4e6){ note("That file is too big to be a room"); return; }
  const fr = new FileReader();
  fr.onload = ()=>{
    let d = null;
    try{ d = JSON.parse(fr.result); }catch(e){ note("That file isn't room data"); return; }
    adopt(ingest(d));
  };
  fr.onerror = ()=> note("Could not read that file");
  fr.readAsText(f);
}

/* base64url so a payload survives a URL, an email and a chat window */
function b64u(bytes){
  let s = "";
  for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64u(s){
  const b = atob(String(s).replace(/-/g,"+").replace(/_/g,"/"));
  const out = new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) out[i] = b.charCodeAt(i);
  return out;
}
async function packShare(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream === "function"){
    try{
      const buf = await new Response(new Blob([bytes]).stream()
                    .pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
      return "z" + b64u(new Uint8Array(buf));
    }catch(e){}
  }
  return "j" + b64u(bytes);                        /* older browsers: plain, just longer */
}
async function unpackShare(s){
  const tag = s.slice(0,1);
  let bytes = unb64u(s.slice(1));
  if(tag === "z"){
    const buf = await new Response(new Blob([bytes]).stream()
                  .pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
    bytes = new Uint8Array(buf);
  } else if(tag !== "j") throw new Error("unknown payload");
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* A link opened in someone else's browser drops the room into their library. */
async function bootShare(){
  const h = location.hash || "";
  if(h.indexOf(SHARE_TAG) !== 0) return;
  const payload = h.slice(SHARE_TAG.length);
  try{ history.replaceState(null, "", location.href.split("#")[0]); }  /* one-shot: a reload will not re-add it */
  catch(e){ location.hash = ""; }
  let data = null;
  try{ data = await unpackShare(payload); }
  catch(e){ note("That share link is damaged"); return; }
  adopt(ingest(data));
}

/* ─────────── geometry helpers ─────────── */
const M = 34;
function viewBox(){ return {x:-M, y:-M, w:doc.room.w+M*2, h:doc.room.h+M*2}; }
function toPlan(cx,cy){
  const vb=viewBox(), r=svg.getBoundingClientRect();
  const s=Math.min(r.width/vb.w, r.height/vb.h);
  return { x:(cx-r.left-(r.width-vb.w*s)/2)/s + vb.x,
           y:(cy-r.top -(r.height-vb.h*s)/2)/s + vb.y };
}
function item(id){ return doc.items.find(i=>i.id===id); }
function patch(id,p){ Object.assign(item(id), p); }

/* ─────────── drawing ─────────── */
function dim(x1,y1,x2,y2,off,label,color,sw){
  color=color||"var(--dim)"; sw=sw||0.7;
  const horiz = Math.abs(y2-y1)<0.01;
  const ax1 = horiz?x1:x1+off, ax2 = horiz?x2:x2+off;
  const ay1 = horiz?y1+off:y1, ay2 = horiz?y2+off:y2;
  const mx=(ax1+ax2)/2, my=(ay1+ay2)/2, t=3.2;
  const ds = doc.dimSize || 8;
  return `<g pointer-events="none">
    <line x1="${x1}" y1="${y1}" x2="${ax1}" y2="${ay1}" stroke="${color}" stroke-width="${sw*0.7}" stroke-dasharray="2 2"/>
    <line x1="${x2}" y1="${y2}" x2="${ax2}" y2="${ay2}" stroke="${color}" stroke-width="${sw*0.7}" stroke-dasharray="2 2"/>
    <line x1="${ax1}" y1="${ay1}" x2="${ax2}" y2="${ay2}" stroke="${color}" stroke-width="${sw}"/>
    <line x1="${ax1-t}" y1="${ay1-t}" x2="${ax1+t}" y2="${ay1+t}" stroke="${color}" stroke-width="${sw}"/>
    <line x1="${ax2-t}" y1="${ay2-t}" x2="${ax2+t}" y2="${ay2+t}" stroke="${color}" stroke-width="${sw}"/>
    <g transform="${horiz?"":`rotate(-90 ${mx} ${my})`}">
      <text x="${mx}" y="${my-2.5}" text-anchor="middle" fill="${color}"
            style="font:600 ${ds}px 'IBM Plex Mono',monospace;letter-spacing:-0.3px">${esc(label)}</text>
    </g></g>`;
}


function capStyle(it){
  const s = (it && it.ls) || doc.labelSize || 8;
  return `font:600 ${s}px 'Archivo Narrow',sans-serif;letter-spacing:${(s*0.1).toFixed(2)}px`;
}

function glyph(it){
  const w=it.w, h=it.h, L=esc(it.label||"");
  const CAP = capStyle(it);

  if(it.type==="door"){
    const r=Math.min(w,h);
    const body = `
      <line x1="0" y1="0" x2="0" y2="${-WALL/2}" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="${r}" y1="0" x2="${r}" y2="${-WALL/2}" stroke="var(--ink)" stroke-width="1.4"/>
      <path d="M ${r} 0 A ${r} ${r} 0 0 1 0 ${r}" fill="none" stroke="var(--dim)" stroke-width="0.8" stroke-dasharray="3 2.5"/>
      <line x1="0" y1="0" x2="0" y2="${r}" stroke="var(--ink)" stroke-width="2.2"/>`;
    return it.flip ? `<g transform="translate(${w} 0) scale(-1 1)">${body}</g>` : body;
  }

  if(it.type==="bed"){
    const p=Math.min(h*0.2,17), pw=w*0.4;
    return `
      <rect x="0" y="0" width="${w}" height="${h}" rx="2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
      <line x1="0" y1="${p}" x2="${w}" y2="${p}" stroke="var(--ink)" stroke-width="0.9"/>
      <rect x="${w*0.055}" y="${p*0.24}" width="${pw}" height="${p*0.52}" rx="2" fill="var(--closet)" stroke="var(--dim)" stroke-width="0.7"/>
      <rect x="${w-w*0.055-pw}" y="${p*0.24}" width="${pw}" height="${p*0.52}" rx="2" fill="var(--closet)" stroke="var(--dim)" stroke-width="0.7"/>
      <line x1="0" y1="${p+(h-p)*0.3}" x2="${w}" y2="${p+(h-p)*0.3}" stroke="var(--dim)" stroke-width="0.7"/>
      <text x="${w/2}" y="${h*0.68}" text-anchor="middle" fill="var(--ink)" style="${CAP}">${L}</text>`;
  }

  if(it.type==="stairs"){
    const n=Math.max(2,Math.round(h/10)), step=h/n;
    let t="";
    for(let i=1;i<n;i++) t+=`<line x1="0" y1="${step*i}" x2="${w}" y2="${step*i}" stroke="var(--ink)" stroke-width="0.7"/>`;
    return `
      <rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="var(--ink)" stroke-width="1.1"/>${t}
      <line x1="${w/2}" y1="2" x2="${w/2}" y2="${h-5}" stroke="var(--ink)" stroke-width="1.1"/>
      <path d="M ${w/2-3.5} ${h-8} L ${w/2} ${h-2} L ${w/2+3.5} ${h-8} Z" fill="var(--ink)"/>
      <text x="${w/2+6}" y="9" fill="var(--dim)" style="${CAP}">${L||"DN"}</text>`;
  }

  if(it.type==="nightstand"){
    return `
      <rect x="0" y="0" width="${w}" height="${h}" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
      <rect x="1.6" y="${h*0.55}" width="${w-3.2}" height="${h*0.34}" fill="none" stroke="var(--dim)" stroke-width="0.7"/>
      <line x1="${w*0.38}" y1="${h*0.72}" x2="${w*0.62}" y2="${h*0.72}" stroke="var(--dim)" stroke-width="1.1"/>
      <text x="${w/2}" y="${h*0.38}" text-anchor="middle" fill="var(--ink)" style="${CAP}">${L}</text>`;
  }

  if(it.type==="shelf"){
    const n = Math.max(2, Math.round(w/8));
    let bars = "";
    for(let i=1;i<n;i++) bars += `<line x1="${w*i/n}" y1="1.6" x2="${w*i/n}" y2="${h*0.55}" stroke="var(--dim)" stroke-width="0.6"/>`;
    return `
      <rect x="0" y="0" width="${w}" height="${h}" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
      ${bars}
      <text x="${w/2}" y="${h-2.5}" text-anchor="middle" fill="var(--ink)" style="${CAP}">${L}</text>`;
  }

  if(it.type==="window"){
    return `<rect x="0" y="0" width="${w}" height="${h}" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/>
            <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="var(--ink)" stroke-width="0.9"/>`;
  }

  if(it.type==="wall") return `<rect x="0" y="0" width="${w}" height="${h}" fill="var(--ink)"/>`;

  if(it.type==="opening"){
    return `<rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="var(--ink)" stroke-width="1.1" stroke-dasharray="4 3"/>
            <text x="${w/2}" y="${h/2+3}" text-anchor="middle" fill="var(--dim)" style="${CAP}">${L||fmt(w)}</text>`;
  }

  // wardrobe / fixture
  const rod = (it.type==="closet" && h>14)
    ? `<line x1="3" y1="5" x2="${w-3}" y2="5" stroke="var(--dim)" stroke-width="0.8"/>` : "";
  const swing = (it.type==="closet") ? doorSwing(it) : "";
  return `${swing}
          <rect x="0" y="0" width="${w}" height="${h}" fill="${it.type==="closet"?"var(--closet)":"var(--paper)"}" stroke="var(--ink)" stroke-width="1.1"/>${rod}
          <text x="${w/2}" y="${h/2+3}" text-anchor="middle" fill="var(--ink)" style="${CAP}">${L}</text>`;
}

/* Hinged PAX doors max out at 19½" wide, so split the frame into that many leaves.
   Leaves hinge on the outer edges and swing into the room off the front face. */
function doorSwing(it){
  const mode = it.doors || "hinged";
  const w = it.w;
  const dash = 'fill="none" stroke="var(--dim)" stroke-width="0.7" stroke-dasharray="3 2.5"';
  const leaf = 'stroke="var(--dim)" stroke-width="1.6"';
  const arw  = 'fill="none" stroke="var(--dim)" stroke-width="0.8"';

  if(mode==="open") return "";

  if(mode==="sliding"){
    return `<line x1="0" y1="-1.5" x2="${w*0.55}" y2="-1.5" ${leaf}/>
            <line x1="${w*0.45}" y1="-3.6" x2="${w}" y2="-3.6" ${leaf}/>
            <path d="M ${w*0.34} -6.6 L ${w*0.2} -6.6 M ${w*0.24} -7.8 L ${w*0.2} -6.6 L ${w*0.24} -5.4" ${arw}/>
            <path d="M ${w*0.66} -6.6 L ${w*0.8} -6.6 M ${w*0.76} -7.8 L ${w*0.8} -6.6 L ${w*0.76} -5.4" ${arw}/>`;
  }

  const n = Math.max(1, Math.ceil(w/19.5 - 0.05));   // PAX hinged doors cap at 19½"
  const L = w/n;
  let s = "";
  for(let i=0;i<n;i++){
    const x1 = i*L, x2 = x1+L;
    if(i < n/2){                                     // hinge on the left edge
      s += `<path d="M ${x2} 0 A ${L} ${L} 0 0 0 ${x1} ${-L}" ${dash}/>
            <line x1="${x1}" y1="0" x2="${x1}" y2="${-L}" ${leaf}/>`;
    } else {                                          // hinge on the right edge
      s += `<path d="M ${x1} 0 A ${L} ${L} 0 0 1 ${x2} ${-L}" ${dash}/>
            <line x1="${x2}" y1="0" x2="${x2}" y2="${-L}" ${leaf}/>`;
    }
  }
  return s;
}

function render2D(){
  const room=doc.room, vb=viewBox();
  const splitY = typeof doc.splitY==="number" ? doc.splitY : room.h;
  const hs = Math.max(4.5, Math.min(room.w,room.h)*0.032);
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);

  let s = `
  <defs>
    <pattern id="g6" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M6 0 L0 0 0 6" fill="none" stroke="var(--grid)" stroke-width="0.35"/></pattern>
    <pattern id="g12" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0 L0 0 0 12" fill="none" stroke="var(--gridfoot)" stroke-width="0.5"/></pattern>
  </defs>
  <rect x="${vb.x}" y="${vb.y}" width="${vb.w}" height="${vb.h}" fill="var(--paper)"/>
  <g opacity="0.9">
    <rect x="0" y="0" width="${room.w}" height="${room.h}" fill="url(#g6)"/>
    <rect x="0" y="0" width="${room.w}" height="${room.h}" fill="url(#g12)"/>
  </g>
  <rect x="0" y="0" width="${room.w}" height="${room.h}" fill="none" stroke="var(--ink)" stroke-width="${WALL}"/>
  <rect x="0" y="0" width="${room.w}" height="${room.h}" fill="none" stroke="var(--paper)" stroke-width="0.6"/>
  <line x1="${-WALL/2}" y1="0" x2="${room.w+WALL/2}" y2="0" stroke="var(--ink)" stroke-width="8"/>
  <text x="0" y="-13" fill="var(--dim)" pointer-events="none"
        style="font:600 6.5px 'Archivo Narrow',sans-serif;letter-spacing:1.6px">EXTERIOR WALL</text>`;

  for(const it of doc.items){
    const cx=it.x+it.w/2, cy=it.y+it.h/2, on=(it.id===sel);
    let inner = glyph(it);
    inner += `<rect x="0" y="0" width="${it.w}" height="${Math.max(it.h,8)}" fill="transparent" data-mode="move" style="cursor:move"/>`;
    if(on){
      inner += `<rect x="-1.5" y="-1.5" width="${it.w+3}" height="${it.h+3}" fill="none" stroke="var(--accent)" stroke-width="1.4" pointer-events="none"/>`;
      for(const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
        inner += `<rect x="${(sx<0?0:it.w)-hs/2}" y="${(sy<0?0:it.h)-hs/2}" width="${hs}" height="${hs}"
                   fill="var(--accent)" stroke="var(--accentink)" stroke-width="0.8"
                   data-mode="${sx},${sy}" style="cursor:nwse-resize"/>`;
      }
    }
    let d = "";
    if(on || showDims){
      const col = on ? "var(--accentink)" : "var(--dim)";
      d += dim(it.x, it.y, it.x+it.w, it.y, -11, fmt(it.w), col);
      if(it.h>8) d += dim(it.x+it.w, it.y, it.x+it.w, it.y+it.h, 11, fmt(it.h), col);
    }
    s += `<g data-id="${it.id}" transform="rotate(${it.rot||0} ${cx} ${cy})">
            <g transform="translate(${it.x} ${it.y})">${inner}</g>${d}</g>`;
  }

  s += dim(0,0,room.w,0,-24,fmt(room.w),null,0.9);
  s += dim(room.w,0,room.w,splitY,16,fmt(splitY),null,0.9);
  s += dim(room.w,splitY,room.w,room.h,16,fmt(room.h-splitY),null,0.9);
  s += dim(room.w,0,room.w,room.h,30,fmt(room.h),null,0.9);

  if(doc.showTitle !== false){
    const area = ((room.w*room.h)/144).toFixed(1);
    const ts = doc.titleSize || 8;
    const nm = (doc.name||"").trim();
    s += `<g transform="translate(0 ${room.h+12})" pointer-events="none">
      <line x1="0" y1="0" x2="${room.w}" y2="0" stroke="var(--ink)" stroke-width="0.9"/>`;
    if(nm) s += `<text x="0" y="${ts+2}" fill="var(--ink)"
        style="font:700 ${ts}px 'Archivo Narrow',sans-serif;letter-spacing:2px">${esc(nm.toUpperCase())}</text>`;
    s += `<text x="${room.w}" y="${ts+2}" text-anchor="end" fill="var(--dim)"
        style="font:500 ${(ts*0.85).toFixed(2)}px 'IBM Plex Mono',monospace">${fmt(room.w)} × ${fmt(room.h)} · ${area} SF · ${doc.items.length} ITEMS</text>
    </g>`;
  }

  svg.innerHTML = s;
}

/* ─────────── panel ─────────── */
function field(id,label,val,step){
  return `<label class="f"><span>${label}</span><input type="number" id="${id}" step="${step||0.25}" value="${val}"></label>`;
}


/* ═══════════ 3D (axonometric, no libraries) ═══════════ */
let mode3d = false, yaw = 18, pitch = 34, ceiling = 96, zoom = 1;
let orbit = null, pinch = null; const ptrs = new Map();
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* default object heights in inches — override per item with the HEIGHT field */
const H3  = {closet:79.25, bed:24, nightstand:26, shelf:79.5, wall:96, fixture:30, door:80,
             window:48};                    /* window h3 = pane height, sill sits at SILL */
const SILL = 30;                            /* window sill elevation above the floor */
const MAT = {closet:"#C7B79C", bed:"#DDE3E6", nightstand:"#C7B79C", shelf:"#C7B79C",
             stairs:"#CDD3D0", wall:"#E2E5DE", door:"#B7A88E", fixture:"#D6DAD3"};
const LIGHT = (()=>{ const l=[-0.35,-0.55,0.78], m=Math.hypot(l[0],l[1],l[2]);
                     return l.map(x=>x/m); })();

function heightOf(it){
  if(it.h3 != null) return it.h3;
  return H3[it.type] != null ? H3[it.type] : 30;
}
function sillOf(it){ return it.sill != null ? it.sill : SILL; }
function basis(){
  const a = yaw*Math.PI/180, p = pitch*Math.PI/180;
  return { u:[Math.cos(a), -Math.sin(a), 0],
           v:[Math.sin(a)*Math.sin(p), Math.cos(a)*Math.sin(p), -Math.cos(p)],
           n:[Math.sin(a)*Math.cos(p), Math.cos(a)*Math.cos(p), Math.sin(p)] };
}
const dot3 = (a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];

function shade(hex,f){
  const n = parseInt(hex.slice(1),16);
  const c = v => Math.max(0, Math.min(255, Math.round(v*f)));
  return `rgb(${c(n>>16&255)},${c(n>>8&255)},${c(n&255)})`;
}

/* local (unrotated) item coords → world plan coords */
function L2W(it,lx,ly){
  const cx = it.x+it.w/2, cy = it.y+it.h/2;
  const v = rotVec(lx-it.w/2, ly-it.h/2, it.rot||0);
  return [cx+v.x, cy+v.y];
}

function render3D(){
  const B = basis(), W = doc.room.w, D = doc.room.h, C = ceiling;
  const labels = [];

  /* Painter's ordering is per OBJECT, not per face. Within one convex box the
     visible faces never overlap in projection, so they need no sorting among
     themselves — and sorting every face globally lets a neighbour's face slip
     between an object's own faces and tear it apart. The sort key drops z and
     uses the footprint centroid: for boxes standing on the floor, the nearer
     footprint is the one that occludes. The room shell always draws first. */
  const shell = {faces:[], sum:0, n:0}, groups = [];
  let cur = shell;
  function group(){ cur = {faces:[], sum:0, n:0}; groups.push(cur); return cur; }

  function add(pts, col, nrm, on){
    const f = nrm ? 0.58 + 0.42*Math.max(0, dot3(nrm,LIGHT)) : 1;
    cur.faces.push({pts, fill:shade(col,f), on:!!on});
    for(const p of pts){ cur.sum += p[0]*B.n[0] + p[1]*B.n[1]; cur.n++; }
  }

  /* extrude a plan quad between two heights, culling back faces */
  function box(q, z0, z1, col, on){
    const cx = (q[0][0]+q[1][0]+q[2][0]+q[3][0])/4;
    const cy = (q[0][1]+q[1][1]+q[2][1]+q[3][1])/4;
    for(let i=0;i<4;i++){
      const A = q[i], Z = q[(i+1)%4];
      const dx = Z[0]-A[0], dy = Z[1]-A[1], m = Math.hypot(dx,dy) || 1;
      let p = [dy/m, -dx/m];
      const mx = (A[0]+Z[0])/2, my = (A[1]+Z[1])/2;
      if(p[0]*(mx-cx)+p[1]*(my-cy) < 0) p = [-p[0],-p[1]];
      if(dot3([p[0],p[1],0], B.n) > 0)
        add([[A[0],A[1],z0],[Z[0],Z[1],z0],[Z[0],Z[1],z1],[A[0],A[1],z1]], col, [p[0],p[1],0], on);
    }
    add(q.map(p=>[p[0],p[1],z1]), col, [0,0,1], on);
    return [cx,cy,z1];
  }

  add([[0,0,0],[W,0,0],[W,D,0],[0,D,0]], "#E4E7DF", [0,0,1]);

  const walls = [
    {pts:[[0,0,0],[W,0,0],[W,0,C],[0,0,C]], nrm:[0,-1,0]},
    {pts:[[0,D,0],[W,D,0],[W,D,C],[0,D,C]], nrm:[0,1,0]},
    {pts:[[0,0,0],[0,D,0],[0,D,C],[0,0,C]], nrm:[-1,0,0]},
    {pts:[[W,0,0],[W,D,0],[W,D,C],[W,0,C]], nrm:[1,0,0]}
  ];
  for(const w of walls)
    if(dot3(w.nrm,B.n) < 0) add(w.pts, MAT.wall, [-w.nrm[0],-w.nrm[1],0.15]);

  for(const it of doc.items){
    if(it.type === "opening") continue;
    const on = (it.id === sel);
    group();

    if(it.type === "window"){
      const cy = it.y+it.h/2, cx = it.x+it.w/2, e = 0.7;
      const s = clamp(sillOf(it), 0, C - 1), hd = clamp(s + heightOf(it), s + 1, C);
      let pts = null;
      if(cy < 12 && dot3([0,-1,0],B.n) < 0)
        pts = [[it.x,e,s],[it.x+it.w,e,s],[it.x+it.w,e,hd],[it.x,e,hd]];
      else if(cy > D-12 && dot3([0,1,0],B.n) < 0)
        pts = [[it.x,D-e,s],[it.x+it.w,D-e,s],[it.x+it.w,D-e,hd],[it.x,D-e,hd]];
      else if(cx < 12 && dot3([-1,0,0],B.n) < 0)
        pts = [[e,it.y,s],[e,it.y+it.h,s],[e,it.y+it.h,hd],[e,it.y,hd]];
      else if(cx > W-12 && dot3([1,0,0],B.n) < 0)
        pts = [[W-e,it.y,s],[W-e,it.y+it.h,s],[W-e,it.y+it.h,hd],[W-e,it.y,hd]];
      if(pts) add(pts, "#AFCBD6", null, on);
      continue;
    }

    if(it.type === "door"){
      const r = Math.min(it.w,it.h), lx = it.flip ? it.w : 0;
      const q = [[lx-0.8,0],[lx+0.8,0],[lx+0.8,r],[lx-0.8,r]].map(c=>L2W(it,c[0],c[1]));
      box(q, 0, heightOf(it), MAT.door, on);
      continue;
    }

    if(it.type === "stairs"){
      const n = Math.max(2, Math.round(it.h/10)), sd = it.h/n, riser = it.h3 ? it.h3/n : 7.5;
      for(let i=0;i<n;i++){
        const q = [[0,i*sd],[it.w,i*sd],[it.w,(i+1)*sd],[0,(i+1)*sd]].map(c=>L2W(it,c[0],c[1]));
        if(i) group();                      /* each tread sorts on its own */
        box(q, 0, (i+1)*riser, MAT.stairs, on);
      }
      continue;
    }

    const q = [[0,0],[it.w,0],[it.w,it.h],[0,it.h]].map(c=>L2W(it,c[0],c[1]));
    const top = box(q, 0, heightOf(it), MAT[it.type] || MAT.fixture, on);
    if(it.label) labels.push({p:top, text:it.label, size:(it.ls||doc.labelSize||8)});
  }

  const order = groups.filter(g=>g.n);
  order.sort((a,b)=> a.sum/a.n - b.sum/b.n);
  const faces = shell.faces.concat(...order.map(g=>g.faces));

  const px = p => [dot3(p,B.u), dot3(p,B.v)];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const f of faces) for(const p of f.pts){
    const s = px(p);
    if(s[0]<x0)x0=s[0]; if(s[0]>x1)x1=s[0];
    if(s[1]<y0)y0=s[1]; if(s[1]>y1)y1=s[1];
  }
  const pad = Math.max(x1-x0, y1-y0)*0.07;
  const mx = (x0+x1)/2, my = (y0+y1)/2;
  const bw = (x1-x0+pad*2)/zoom, bh = (y1-y0+pad*2)/zoom;
  svg.setAttribute("viewBox", `${mx-bw/2} ${my-bh/2} ${bw} ${bh}`);

  let out = `<rect x="${mx-bw}" y="${my-bh}" width="${bw*2}" height="${bh*2}" fill="var(--paper)"/>`;
  for(const f of faces){
    const d = f.pts.map(p=>{const s=px(p); return s[0].toFixed(2)+","+s[1].toFixed(2);}).join(" ");
    out += `<polygon points="${d}" fill="${f.fill}" stroke="${f.on?"var(--accent)":"var(--ink)"}" stroke-width="${f.on?1.3:0.35}" stroke-linejoin="round"/>`;
  }
  for(const l of labels){
    const s = px(l.p);
    out += `<text x="${s[0].toFixed(2)}" y="${s[1].toFixed(2)}" text-anchor="middle" fill="var(--dim)"
             style="font:600 ${l.size}px 'Archivo Narrow',sans-serif;letter-spacing:0.5px">${esc(l.text)}</text>`;
  }
  svg.innerHTML = out;
}

function sync3(){
  const a = document.activeElement;
  if($("v3yaw")   !== a) $("v3yaw").value   = Math.round(yaw);
  if($("v3pitch") !== a) $("v3pitch").value = Math.round(pitch);
}
function renderPlan(){
  svg.style.cursor = mode3d ? (orbit ? "grabbing" : "grab") : "default";
  mode3d ? render3D() : render2D();
}

function renderPanel(){
  $("docname").textContent = doc.name;
  renderRooms();
  if(document.activeElement !== $("tName")) $("tName").value = doc.name || "";
  if(document.activeElement !== $("tSize")) $("tSize").value = doc.titleSize || 8;
  $("tShow").classList.toggle("on", doc.showTitle !== false);
  $("tShow").textContent = doc.showTitle !== false ? "SHOW BLOCK" : "HIDDEN";
  if(document.activeElement !== $("lSize")) $("lSize").value = doc.labelSize || 8;
  if(document.activeElement !== $("dSize")) $("dSize").value = doc.dimSize || 8;
  $("sec3d").style.display = mode3d ? "block" : "none";
  $("b3d").classList.toggle("on", mode3d);
  $("b3d").textContent = mode3d ? "PLAN" : "3D";
  if(document.activeElement !== $("v3yaw"))   $("v3yaw").value   = yaw;
  if(document.activeElement !== $("v3pitch")) $("v3pitch").value = pitch;
  if(document.activeElement !== $("v3ceil"))  $("v3ceil").value  = ceiling;
  $("rw").value = doc.room.w;
  $("rh").value = doc.room.h;
  $("rs").value = doc.splitY;
  document.querySelectorAll(".snap").forEach(b=>b.classList.toggle("on", +b.dataset.s===snap));
  $("bFeet").classList.toggle("on", feet);
  $("bFeet").textContent = feet ? "FT-IN" : "INCHES";
  $("bDims").classList.toggle("on", showDims);

  const it = sel ? item(sel) : null;
  $("selHead").textContent = it ? "SELECTED" : "SELECTION";

  if(!it){
    panelFor = null;
    $("props").innerHTML = `<div id="hint">Tap anything on the plan to move it, drag the yellow
      corners to resize, or type exact inches here.</div>`;
    return;
  }
  panelFor = it.id;

  let presets = "";
  if(it.type==="closet"){
    presets += `<div class="brk"></div><span class="lbl">IKEA PAX FRAME</span><div class="brk"></div>`;
    presets += PAX_W.map(([n,v])=>`<button class="pw ${Math.abs(it.w-v)<0.01?"on":""}" data-v="${v}" data-n="${n}">${n}"</button>`).join("");
    presets += `<div class="brk"></div>`;
    presets += PAX_D.map(([n,v])=>`<button class="pd ${Math.abs(it.h-v)<0.01?"on":""}" data-v="${v}">${n}</button>`).join("");
    presets += `<div class="brk"></div><span class="lbl">DOORS</span><div class="brk"></div>`;
    presets += ["hinged","sliding","open"].map(m=>
      `<button class="dr ${(it.doors||"hinged")===m?"on":""}" data-m="${m}">${m.toUpperCase()}</button>`).join("");
    presets += `<div class="brk"></div>`;
  }
  if(it.type==="nightstand"){
    presets += NIGHT.map(([n,w,h])=>
      `<button class="ns ${(it.w===w&&it.h===h)?"on":""}" data-n="${n}" data-w="${w}" data-h="${h}">${n}</button>`).join("");
    presets += `<div class="brk"></div>`;
  }
  if(it.type==="shelf"){
    presets += SHELF.map(([n,w,h])=>
      `<button class="sh ${(it.w===w&&it.h===h)?"on":""}" data-n="${n}" data-w="${w}" data-h="${h}">${n}</button>`).join("");
    presets += `<div class="brk"></div>`;
  }
  if(it.type==="bed"){
    presets += Object.entries(BEDS).map(([k,[w,h]])=>
      `<button class="bd ${(it.w===w&&it.h===h)?"on":""}" data-k="${k}">${k.toUpperCase()}</button>`).join("");
    presets += `<div class="brk"></div>`;
  }

  $("props").innerHTML = `
    <div class="row">
      <label class="f"><span>TYPE</span><select id="pType">
        ${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===it.type?"selected":""}>${v}</option>`).join("")}
      </select></label>
      <label class="f"><span>LABEL</span><input id="pLabel" type="text" value="${esc(it.label||"")}"></label>
    </div>
    <div class="row">${field("pW","WIDTH",it.w)}${field("pH","DEPTH",it.h)}</div>
    <div class="row">${field("pX","FROM LEFT",it.x)}${field("pY","FROM TOP",it.y)}
      ${field("pLS","LABEL SIZE", it.ls || doc.labelSize || 8, 0.5)}</div>
    <div class="row">${field("pZ","HEIGHT (3D)", heightOf(it), 1)}
      ${it.type==="window" ? field("pSill","SILL (3D)", sillOf(it), 1) : ""}</div>
    <div class="chips">
      ${presets}
      <button id="pRot">ROTATE 90°</button>
      ${it.type==="door"?'<button id="pFlip">FLIP HINGE</button>':""}
      <button id="pDup">DUPLICATE</button>
      <button id="pDel" class="danger">DELETE</button>
    </div>`;

  bindProps();
}

function syncPanel(){
  const a = document.activeElement;
  const it = sel ? item(sel) : null;
  const set = (id,v)=>{ const e=$(id); if(e && e!==a) e.value = v; };
  set("rw", doc.room.w); set("rh", doc.room.h); set("rs", doc.splitY);
  if(it && panelFor===it.id){
    set("pW", it.w); set("pH", it.h); set("pX", it.x); set("pY", it.y);
  }
}

function bindProps(){
  const it = () => item(sel);
  const num = (id,key)=>{
    const e=$(id); if(!e) return;
    e.addEventListener("input", ()=>{
      const v = parseFloat(e.value); if(isNaN(v)) return;
      const p = {}; p[key]=v;
      if(key==="w" && it().type==="door") p.h=v;
      patch(sel,p); renderPlan(); save();
    });
    e.addEventListener("focus", ()=>{ push(); }, {once:false});
  };
  num("pW","w"); num("pH","h"); num("pX","x"); num("pY","y"); num("pLS","ls"); num("pZ","h3");
  num("pSill","sill");

  $("pType").addEventListener("change", e=>{ push(); patch(sel,{type:e.target.value}); render(); });
  $("pLabel").addEventListener("input", e=>{ patch(sel,{label:e.target.value}); renderPlan(); save(); });
  $("pRot").addEventListener("click", ()=>{ push(); patch(sel,{rot:((it().rot||0)+90)%360}); render(); });
  if($("pFlip")) $("pFlip").addEventListener("click", ()=>{ push(); patch(sel,{flip:!it().flip}); render(); });
  $("pDup").addEventListener("click", ()=>{
    push(); const c = Object.assign({}, it(), {id:uid(), x:it().x+6, y:it().y+6});
    doc.items.push(c); sel = c.id; render();
  });
  $("pDel").addEventListener("click", ()=>{
    push(); doc.items = doc.items.filter(i=>i.id!==sel); sel=null; render();
  });

  document.querySelectorAll(".pw").forEach(b=>b.addEventListener("click",()=>{
    push(); patch(sel,{w:+b.dataset.v, label:"PAX "+b.dataset.n}); render();
  }));
  document.querySelectorAll(".pd").forEach(b=>b.addEventListener("click",()=>{
    push(); patch(sel,{h:+b.dataset.v}); render();
  }));
  document.querySelectorAll(".bd").forEach(b=>b.addEventListener("click",()=>{
    const [w,h]=BEDS[b.dataset.k]; push(); patch(sel,{w,h,label:b.dataset.k}); render();
  }));
  document.querySelectorAll(".dr").forEach(b=>b.addEventListener("click",()=>{
    push(); patch(sel,{doors:b.dataset.m}); render();
  }));
  document.querySelectorAll(".ns,.sh").forEach(b=>b.addEventListener("click",()=>{
    push(); patch(sel,{w:+b.dataset.w, h:+b.dataset.h, label:b.dataset.n}); render();
  }));
}

function render(){ renderPlan(); renderPanel(); save(); }

/* ─────────── pointer interaction ─────────── */
function pdist(){
  const p = [...ptrs.values()];
  return p.length<2 ? 0 : Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
}

svg.addEventListener("pointerdown", e=>{
  if(mode3d){
    ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(ptrs.size === 1){ orbit = {x:e.clientX, y:e.clientY, yaw, pitch}; pinch = null; }
    else if(ptrs.size === 2){ orbit = null; pinch = {d:pdist(), zoom}; }
    svg.style.cursor = "grabbing";
    e.preventDefault();
    return;
  }
  const hit = e.target.closest("[data-mode]");
  if(!hit){ if(sel!==null){ sel=null; render(); } return; }
  const g = e.target.closest("[data-id]");
  if(!g) return;
  push();
  sel = g.dataset.id;
  drag = { mode:hit.dataset.mode, start:toPlan(e.clientX,e.clientY), orig:Object.assign({},item(sel)) };
  render();
  e.preventDefault();
});

window.addEventListener("pointermove", e=>{
  if(mode3d){
    if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch && ptrs.size >= 2){
      const d = pdist();
      if(d > 0) zoom = clamp(pinch.zoom * d / pinch.d, 0.3, 6);
      renderPlan();
    } else if(orbit){
      yaw   = (orbit.yaw - (e.clientX-orbit.x)*0.4 + 720) % 360;
      pitch = clamp(orbit.pitch + (e.clientY-orbit.y)*0.25, 8, 85);
      renderPlan(); sync3();
    }
    return;
  }
  if(!drag) return;
  const p = toPlan(e.clientX,e.clientY);
  const dx = p.x-drag.start.x, dy = p.y-drag.start.y, o = drag.orig;

  if(drag.mode==="move"){
    patch(sel,{x:sn(o.x+dx), y:sn(o.y+dy)});
  } else {
    const [sx,sy] = drag.mode.split(",").map(Number);
    const rot = o.rot||0, l = rotVec(dx,dy,-rot);
    let w = Math.max(snap||1, sn(o.w + l.x*sx));
    let h = Math.max(snap||1, sn(o.h + l.y*sy));
    if(o.type==="door") h = w;
    const oc = {x:o.x+o.w/2, y:o.y+o.h/2};
    const fw = rotVec(-sx*o.w/2, -sy*o.h/2, rot);
    const fixed = {x:oc.x+fw.x, y:oc.y+fw.y};
    const nfw = rotVec(-sx*w/2, -sy*h/2, rot);
    patch(sel,{w, h, x:sn(fixed.x-nfw.x-w/2), y:sn(fixed.y-nfw.y-h/2)});
  }
  renderPlan(); syncPanel();
});

window.addEventListener("pointerup", e=>{
  if(mode3d){
    ptrs.delete(e.pointerId);
    if(ptrs.size < 2) pinch = null;
    if(ptrs.size === 0) orbit = null;
    /* dropping from pinch to one finger: re-seed orbit so drag keeps working */
    else if(ptrs.size === 1 && !orbit){
      const p = [...ptrs.values()][0];
      orbit = {x:p.x, y:p.y, yaw, pitch};
    }
    svg.style.cursor = "grab";
    return;
  }
  if(drag){ drag=null; save(); }
});
window.addEventListener("pointercancel", e=>{ ptrs.delete(e.pointerId); orbit=null; pinch=null; drag=null; });

svg.addEventListener("wheel", e=>{
  if(!mode3d) return;
  e.preventDefault();
  zoom = clamp(zoom * (e.deltaY < 0 ? 1.12 : 0.893), 0.3, 6);
  renderPlan();
}, {passive:false});

/* ─────────── keyboard ─────────── */
window.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="select"||tag==="textarea") return;
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="z"){
    e.preventDefault(); e.shiftKey ? redo() : undo(); return;
  }
  if(mode3d){
    const k = {ArrowLeft:[-5,0], ArrowRight:[5,0], ArrowUp:[0,-3], ArrowDown:[0,3]}[e.key];
    if(k){ e.preventDefault();
      yaw = (yaw + k[0] + 720) % 360;
      pitch = clamp(pitch + k[1], 8, 85);
      renderPlan(); sync3(); }
    return;
  }
  if(!sel) return;
  if(e.key==="Delete"||e.key==="Backspace"){
    e.preventDefault(); push();
    doc.items = doc.items.filter(i=>i.id!==sel); sel=null; render(); return;
  }
  const step = e.shiftKey ? (snap||1)*6 : (snap||1);
  const map = {ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]};
  if(map[e.key]){
    e.preventDefault(); push();
    const it=item(sel); patch(sel,{x:it.x+map[e.key][0], y:it.y+map[e.key][1]});
    renderPlan(); syncPanel(); save();
  }
});

/* ─────────── toolbar ─────────── */
$("bFeet").onclick = ()=>{ feet=!feet; render(); };
$("bDims").onclick = ()=>{ showDims=!showDims; render(); };
$("b3d").onclick = ()=>{ mode3d = !mode3d; render(); };
$("v3yaw").addEventListener("input",   e=>{ yaw = +e.target.value;   renderPlan(); });
$("v3pitch").addEventListener("input", e=>{ pitch = +e.target.value; renderPlan(); });
$("v3ceil").addEventListener("input",  e=>{ const v=parseFloat(e.target.value);
  if(!isNaN(v)) { ceiling = Math.max(60, Math.min(180, v)); renderPlan(); } });
$("v3reset").onclick = ()=>{ yaw=18; pitch=34; ceiling=96; zoom=1; render(); };

$("bUndo").onclick = undo;
$("bRedo").onclick = redo;

$("tName").addEventListener("input", e=>{
  doc.name = e.target.value; $("docname").textContent = doc.name; renderPlan(); save();
});
$("tName").addEventListener("focus", ()=>push());
$("tSize").addEventListener("input", e=>{
  const v = parseFloat(e.target.value); if(isNaN(v)) return;
  doc.titleSize = Math.max(3, Math.min(24, v)); renderPlan(); save();
});
$("tSize").addEventListener("focus", ()=>push());
$("tShow").onclick = ()=>{ push(); doc.showTitle = (doc.showTitle===false); render(); };

[["lSize","labelSize"],["dSize","dimSize"]].forEach(([id,key])=>{
  $(id).addEventListener("input", e=>{
    const v = parseFloat(e.target.value); if(isNaN(v)) return;
    doc[key] = Math.max(2, Math.min(30, v)); renderPlan(); save();
  });
  $(id).addEventListener("focus", ()=>push());
});

document.querySelectorAll(".snap").forEach(b=>b.onclick=()=>{ snap=+b.dataset.s; renderPanel(); });

["rw","rh","rs"].forEach(id=>{
  $(id).addEventListener("input", e=>{
    const v = parseFloat(e.target.value); if(isNaN(v)) return;
    if(id==="rw") doc.room.w=v; else if(id==="rh") doc.room.h=v; else doc.splitY=v;
    renderPlan(); save();
  });
  $(id).addEventListener("focus", ()=>push());
});

$("addRow").innerHTML = Object.entries(TYPES)
  .map(([k,v])=>`<button data-add="${k}">${v.toUpperCase()}</button>`).join("");
$("addRow").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
  const t = b.dataset.add;
  const base = {
    closet:{w:39.25,h:22.875,label:"PAX 39¼",doors:"hinged"},
    bed:{w:54,h:75,label:"Full"},
    nightstand:{w:18.125,h:13.75,label:"HEMNES"},
    shelf:{w:31.5,h:11,label:"BILLY 31½"},
    door:{w:32,h:32,label:"Door",flip:false},
    window:{w:36,h:8,label:"Window"},
    stairs:{w:32,h:40,label:"DN"},
    wall:{w:40,h:WALL,label:"Wall"},
    opening:{w:34,h:12,label:"Opening"},
    fixture:{w:30,h:24,label:"Fixture"}
  }[t];
  push();
  /* start in the top-left corner at 0,0 — centring put anything wider than the
     room at a negative FROM LEFT. Step down the diagonal only when that exact
     spot is taken, so a run of adds is not one invisible pile. */
  let x = 0, y = 0;
  while(doc.items.some(i=>i.x===x && i.y===y)){ x = sn(x+6); y = sn(y+6); }
  const o = Object.assign({id:uid(), type:t, rot:0, x, y}, base);
  doc.items.push(o); sel=o.id; render();
});

function note(msg){
  ["note","roomNote"].forEach(id=>{
    const e = $(id); if(!e) return;
    e.textContent = msg;
    setTimeout(()=>{ if(e.textContent===msg) e.textContent=""; }, 2600);
  });
}

$("bSvg").onclick = ()=>{
  if(sel){ sel = null; render(); }          // keep selection handles out of the file
  const NS = "http://www.w3.org/2000/svg";
  const c  = svg.cloneNode(true);           // serializer adds xmlns itself — don't set it
  const vb = viewBox();
  c.setAttribute("width",  Math.round(vb.w*4));   // ~4px per inch
  c.setAttribute("height", Math.round(vb.h*4));

  const st = document.createElementNS(NS, "style");
  st.textContent =
    "@import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');" +
    "svg{--paper:#F7F8F5;--grid:#DCE4E7;--gridfoot:#BACAD1;--ink:#17222A;--dim:#415A66;" +
    "--accent:#F2B705;--accentink:#16323F;--closet:#E7EDEA}";
  c.insertBefore(st, c.firstChild);

  const out = '<?xml version="1.0" encoding="UTF-8"?>\n' +
              new XMLSerializer().serializeToString(c);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], {type:"image/svg+xml;charset=utf-8"}));
  a.download = "floorplan.svg"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  note("Exported floorplan.svg");
};

$("bJson").onclick = async ()=>{
  try{ await navigator.clipboard.writeText(JSON.stringify(doc,null,2)); note("Plan data copied"); }
  catch(e){ note("Copy blocked — export the drawing instead"); }
};

$("bReset").onclick = ()=>{ push(); doc = clone(SKETCH); sel=null; render(); note("Reset to the sketch"); };

/* ─────────── rooms: switch, rename, delete ─────────── */
$("roomSel").addEventListener("change", e=>switchRoom(e.target.value));

$("roomName").addEventListener("input", e=>{
  const r = activeRoom(); if(!r) return;
  r.name = txt(e.target.value,60) || "Untitled room";
  r.updated = Date.now(); libSave();
  const s = $("roomSel"), o = s.options[s.selectedIndex];
  if(o) o.textContent = r.name;
});

$("bNewRoom").onclick = ()=>{
  const blank = clone(SKETCH);
  blank.items = []; blank.name = "";
  openRoom(roomRec("Room " + (lib.rooms.length+1), blank));
  note("Started an empty room");
};

$("bDupRoom").onclick = ()=>{
  save();
  const r = activeRoom(); if(!r) return;
  openRoom(roomRec(r.name + " copy", clone(r.doc)));
  note("Duplicated the room");
};

/* two taps to delete — the panel has no dialogs anywhere else */
$("bDelRoom").onclick = ()=>{
  const b = $("bDelRoom");
  if(!armDel){
    armDel = true; b.textContent = "CONFIRM DELETE";
    setTimeout(()=>{ if(armDel){ armDel = false; b.textContent = "DELETE"; } }, 4000);
    return;
  }
  armDel = false; b.textContent = "DELETE";
  delRoom(lib.activeId);
};

/* ─────────── rooms: hand off to another browser ─────────── */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{                                              /* clipboard API is blocked over file:// */
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly","");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove(); return ok;
  }catch(e){ return false; }
}

$("bExpRoom").onclick = ()=>{
  save();
  const r = activeRoom(); if(!r) return;
  download(fileSafe(r.name) + ".room.json", JSON.stringify(bundle([r]), null, 2));
  note("Exported " + r.name);
};

$("bExpAll").onclick = ()=>{
  save();
  download("floorplan-rooms.json", JSON.stringify(bundle(lib.rooms), null, 2));
  note("Exported all " + lib.rooms.length + " rooms");
};

$("bImport").onclick = ()=> $("roomFile").click();
$("roomFile").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  e.target.value = "";                              /* so the same file re-imports */
  if(f) readRoomFile(f);
});

$("bShare").onclick = async ()=>{
  save();
  const r = activeRoom(); if(!r) return;
  let url;
  try{ url = location.href.split("#")[0] + SHARE_TAG + await packShare(bundle([r])); }
  catch(e){ note("Could not build a share link"); return; }
  if(url.length > 60000){ note("This room is too big for a link — export the file instead"); return; }
  if(await copyText(url)) note("Link copied — anyone who opens it gets this room");
  else { location.hash = url.slice(url.indexOf("#")+1); note("Copy blocked — copy the address bar"); }
};

/* dropping a room file anywhere on the page imports it */
["dragover","drop"].forEach(t=>window.addEventListener(t, e=>{
  const dt = e.dataTransfer;
  if(!dt || Array.prototype.indexOf.call(dt.types||[], "Files") < 0) return;
  e.preventDefault();
  if(t==="drop" && dt.files && dt.files[0]) readRoomFile(dt.files[0]);
}));

/* ─────────── go ─────────── */
load();
render();
bootShare();
window.addEventListener("resize", renderPlan);
</script>
</body>
